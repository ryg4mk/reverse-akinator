<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1022">
  <meta name="description" content="質問するのは、あなた。秘密のお題を「はい・いいえ」のヒントから当てる、無料の逆アキネーターゲーム！">
  <meta property="og:type" content="website">
  <meta property="og:title" content="逆アキネーター | 質問するのは、あなた。">
  <meta property="og:description" content="ゲームが思い浮かべたお題を当てよう！ 質問を選んで、答えがわかったら文字入力。">
  <title>逆アキネーター — 質問するのは、あなた。</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=1.3.0">
  <script defer src="data.js?v=1.3.0"></script>
  <script defer src="app.js?v=1.3.0"></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="site-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="逆アキネーターのトップへ" id="brand-link">
        <span class="brand-icon" aria-hidden="true"><span>?</span></span>
        <span class="brand-copy"><strong>REVERSE<span>!</span></strong><small>AKINATOR GAME</small></span>
      </a>
      <div class="header-right">
        <span class="version-chip"><span class="online-dot"></span> OFFLINE READY</span>
        <button type="button" id="sound-toggle" class="icon-button" aria-label="サウンドをオンにする" title="サウンドのオン／オフ"></button>
      </div>
    </header>
    <main id="app" aria-live="off"></main>
    <footer class="site-footer">
      <span>逆アキネーター <span class="muted">/ 質問するのは、あなた。</span></span>
      <span>通信なしで遊べるブラウザゲーム</span>
    </footer>
  </div>
  <dialog id="guess-dialog" class="modal">
    <form method="dialog" id="guess-form" class="modal-form">
      <div class="modal-top"><span class="eyebrow">FINAL ANSWER</span><button type="button" class="close-button" data-close="guess" aria-label="閉じる">×</button></div>
      <div class="guess-symbol" aria-hidden="true">✦</div>
      <h2>答えがわかった？</h2>
      <p class="muted">思い浮かべた名前を入力してみよう。</p>
      <label for="guess-input" class="sr-only">あなたの回答</label>
      <input id="guess-input" name="guess" type="text" placeholder="例：ねこ、りんご、スマホ" autocomplete="off" enterkeyhint="done" maxlength="48" required>
      <p id="guess-error" class="field-error" aria-live="polite"></p>
      <button type="submit" id="guess-submit" class="primary-btn full">この答えで勝負する <span aria-hidden="true">↗</span></button>
      <button type="button" data-close="guess" class="text-btn">もう少し質問する</button>
    </form>
  </dialog>
  <dialog id="history-dialog" class="modal history-dialog" aria-label="質問の履歴"></dialog>
  <dialog id="result-dialog" class="modal result-modal">
    <div id="result-content"></div>
  </dialog>
  <dialog id="reveal-dialog" class="modal confirm-modal">
    <div class="modal-top"><span class="eyebrow">GIVE UP?</span><button type="button" data-close="reveal" class="close-button" aria-label="閉じる">×</button></div>
    <div class="confirm-icon" aria-hidden="true">◌</div>
    <h2>答えを見ますか？</h2>
    <p class="muted">ここで答えを見ると、このラウンドはクリア扱いになりません。</p>
    <div class="modal-actions"><button type="button" class="secondary-btn" data-close="reveal">まだ続ける</button><button type="button" class="danger-btn" id="reveal-yes">答えを見る</button></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
